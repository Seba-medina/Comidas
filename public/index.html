<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comidas del Día</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #faf6f0;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 { text-align: center; color: #b5651d; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 30px auto;
    }
    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }
    .card h2 {
      margin: 0;
      padding: 14px;
      background: #f4a261;
      color: white;
      font-size: 1.1em;
    }
    .img-wrap {
      width: 100%;
      height: 220px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card label {
      display: block;
      padding: 12px;
      background: #2a9d8f;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .card label:hover { background: #21867a; }
    .card label.loading { background: #999; cursor: wait; }
    .card input[type="file"] { display: none; }
    .msg {
      font-size: 0.85em;
      padding: 0 12px 10px;
      min-height: 1em;
      color: #e63946;
    }
  </style>
</head>
<body>
  <h1>🍽️ Comidas del Día</h1>
  <div class="grid" id="grid"></div>

  <script>
    const COMIDAS = {
      desayuno: "Desayuno",
      almuerzo: "Almuerzo",
      merienda: "Merienda",
      cena: "Cena",
    };

    const grid = document.getElementById("grid");

    for (const [key, nombre] of Object.entries(COMIDAS)) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h2>${nombre}</h2>
        <div class="img-wrap" id="wrap-${key}">Sin foto todavía</div>
        <label id="label-${key}" for="input-${key}">Subir / cambiar foto</label>
        <input type="file" id="input-${key}" accept="image/*" capture="environment">
        <div class="msg" id="msg-${key}"></div>
      `;
      grid.appendChild(card);

      // Al cargar, intenta mostrar la foto ya guardada
      probarImagen(key);

      document.getElementById(`input-${key}`).addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) subirFoto(key, file);
      });
    }

    function probarImagen(key) {
      const img = new Image();
      img.onload = () => {
        document.getElementById(`wrap-${key}`).innerHTML = "";
        document.getElementById(`wrap-${key}`).appendChild(img);
      };
      img.onerror = () => {
        // No hay foto todavía, se deja el placeholder
      };
      img.src = `/api/image?comida=${key}&t=${Date.now()}`;
    }

    async function subirFoto(key, file) {
      const label = document.getElementById(`label-${key}`);
      const msg = document.getElementById(`msg-${key}`);
      msg.textContent = "";
      label.classList.add("loading");
      label.textContent = "Subiendo...";

      const formData = new FormData();
      formData.append("comida", key);
      formData.append("foto", file);

      try {
        const res = await fetch("/api/upload", { method: "POST", body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Error al subir");
        probarImagen(key);
      } catch (err) {
        msg.textContent = err.message;
      } finally {
        label.classList.remove("loading");
        label.textContent = "Subir / cambiar foto";
      }
    }
  </script>
</body>
</html>
