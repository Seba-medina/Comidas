<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comidas del Día</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #faf6f0;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 { text-align: center; color: #b5651d; margin-bottom: 5px; }

    .day-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      max-width: 640px;
      margin: 20px auto;
      flex-wrap: wrap;
    }
    .day-nav button {
      background: #f4a261;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 1em;
      cursor: pointer;
    }
    .day-nav button:hover { background: #e08c45; }
    .day-nav .fecha {
      font-weight: bold;
      font-size: 1.1em;
      text-align: center;
      min-width: 220px;
      text-transform: capitalize;
    }
    .day-nav input[type="date"] {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 900px;
      margin: 30px auto;
    }
    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }
    .card h2 {
      margin: 0;
      padding: 14px;
      background: #f4a261;
      color: white;
      font-size: 1.2em;
    }
    .img-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      overflow: hidden;
      cursor: default;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
      background: #222;
    }

    /* Lightbox para ver la foto en grande */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 24px;
      color: white;
      font-size: 2.2em;
      cursor: pointer;
      line-height: 1;
      background: none;
      border: none;
    }
    .card label {
      display: block;
      padding: 12px;
      background: #2a9d8f;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95em;
    }
    .card label:hover { background: #21867a; }
    .card label.loading { background: #999; cursor: wait; }
    .card input[type="file"] { display: none; }
    .msg {
      font-size: 0.8em;
      padding: 0 10px 10px;
      min-height: 1em;
      color: #e63946;
    }

    .pdf-box {
      max-width: 640px;
      margin: 40px auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }
    #btn-toggle-pdf {
      background: #b5651d;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 1.05em;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    #btn-toggle-pdf:hover { background: #97531a; }
    .pdf-options {
      display: none;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .pdf-options.open { display: block; }
    .pdf-options p { margin-top: 0; }
    .pdf-options .rango {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 16px 0;
      align-items: center;
    }
    .pdf-options label.rango-label {
      font-size: 0.9em;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }
    .pdf-options input[type="date"] {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    #btn-pdf {
      background: #2a9d8f;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1em;
      cursor: pointer;
      font-weight: bold;
    }
    #btn-pdf:hover { background: #21867a; }
    #btn-pdf:disabled { background: #ccc; cursor: wait; }
    .pdf-msg {
      margin-top: 10px;
      font-size: 0.85em;
      min-height: 1em;
      color: #e63946;
    }
  </style>
</head>
<body>
  <h1>🍽️ Comidas del Día</h1>

  <div class="day-nav">
    <button id="btn-prev">‹ Día anterior</button>
    <div>
      <div class="fecha" id="fecha-label"></div>
      <input type="date" id="fecha-picker">
    </div>
    <button id="btn-next">Día siguiente ›</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="pdf-box">
    <button id="btn-toggle-pdf">📄 Generar PDF</button>
    <div class="pdf-options" id="pdf-options">
      <p>Elegí el rango de fechas (una hoja por día, con las 4 comidas).</p>
      <div class="rango">
        <label class="rango-label">Desde
          <input type="date" id="pdf-desde">
        </label>
        <label class="rango-label">Hasta
          <input type="date" id="pdf-hasta">
        </label>
      </div>
      <button id="btn-pdf">Descargar PDF</button>
      <div class="pdf-msg" id="pdf-msg"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Foto ampliada">
  </div>

  <script>
    const COMIDAS = {
      desayuno: "Desayuno",
      almuerzo: "Almuerzo",
      merienda: "Merienda",
      cena: "Cena",
    };
    const DIAS_SEMANA = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

    let currentDate = new Date();
    currentDate.setHours(0,0,0,0);

    const grid = document.getElementById("grid");
    const fechaLabel = document.getElementById("fecha-label");
    const fechaPicker = document.getElementById("fecha-picker");

    function toISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function renderFechaLabel() {
      const texto = `${DIAS_SEMANA[currentDate.getDay()]} ${currentDate.getDate()} de ${MESES[currentDate.getMonth()]} de ${currentDate.getFullYear()}`;
      fechaLabel.textContent = texto;
      fechaPicker.value = toISO(currentDate);
    }

    function buildCards() {
      grid.innerHTML = "";
      for (const [key, nombre] of Object.entries(COMIDAS)) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h2>${nombre}</h2>
          <div class="img-wrap" id="wrap-${key}">Sin foto todavía</div>
          <label id="label-${key}" for="input-${key}">Subir / cambiar foto</label>
          <input type="file" id="input-${key}" accept="image/jpeg,image/png">
          <div class="msg" id="msg-${key}"></div>
        `;
        grid.appendChild(card);

        document.getElementById(`input-${key}`).addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) subirFoto(key, file);
          e.target.value = "";
        });
      }
      cargarFotosDelDia();
    }

    function cargarFotosDelDia() {
      const fechaStr = toISO(currentDate);
      for (const key of Object.keys(COMIDAS)) {
        const wrap = document.getElementById(`wrap-${key}`);
        wrap.innerHTML = "Sin foto todavía";
        const img = new Image();
        img.onload = () => {
          wrap.innerHTML = "";
          img.addEventListener("click", () => abrirLightbox(img.src));
          wrap.appendChild(img);
        };
        img.onerror = () => {};
        img.src = `/api/image?comida=${key}&fecha=${fechaStr}&t=${Date.now()}`;
      }
    }

    // --- Lightbox (ver foto en grande) ---
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    document.getElementById("lightbox-close").addEventListener("click", cerrarLightbox);
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) cerrarLightbox();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") cerrarLightbox();
    });

    function abrirLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add("open");
    }
    function cerrarLightbox() {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
    }

    async function subirFoto(key, file) {
      const label = document.getElementById(`label-${key}`);
      const msg = document.getElementById(`msg-${key}`);
      msg.textContent = "";
      label.classList.add("loading");
      label.textContent = "Subiendo...";

      const formData = new FormData();
      formData.append("comida", key);
      formData.append("fecha", toISO(currentDate));
      formData.append("foto", file);

      try {
        const res = await fetch("/api/upload", { method: "POST", body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Error al subir");
        cargarFotosDelDia();
      } catch (err) {
        msg.textContent = err.message;
      } finally {
        label.classList.remove("loading");
        label.textContent = "Subir / cambiar foto";
      }
    }

    document.getElementById("btn-prev").addEventListener("click", () => {
      currentDate.setDate(currentDate.getDate() - 1);
      renderFechaLabel();
      cargarFotosDelDia();
    });
    document.getElementById("btn-next").addEventListener("click", () => {
      currentDate.setDate(currentDate.getDate() + 1);
      renderFechaLabel();
      cargarFotosDelDia();
    });
    fechaPicker.addEventListener("change", () => {
      if (!fechaPicker.value) return;
      const [y, m, d] = fechaPicker.value.split("-").map(Number);
      currentDate = new Date(y, m - 1, d);
      renderFechaLabel();
      cargarFotosDelDia();
    });

    // --- Generar PDF ---
    const pdfDesde = document.getElementById("pdf-desde");
    const pdfHasta = document.getElementById("pdf-hasta");
    const btnPdf = document.getElementById("btn-pdf");
    const pdfMsg = document.getElementById("pdf-msg");
    const btnTogglePdf = document.getElementById("btn-toggle-pdf");
    const pdfOptions = document.getElementById("pdf-options");

    pdfDesde.value = toISO(currentDate);
    pdfHasta.value = toISO(currentDate);

    btnTogglePdf.addEventListener("click", () => {
      pdfOptions.classList.toggle("open");
    });

    btnPdf.addEventListener("click", async () => {
      pdfMsg.textContent = "";
      pdfMsg.style.color = "#e63946";

      if (!pdfDesde.value || !pdfHasta.value) {
        pdfMsg.textContent = "Elegí ambas fechas.";
        return;
      }
      if (pdfDesde.value > pdfHasta.value) {
        pdfMsg.textContent = "La fecha 'desde' tiene que ser anterior a 'hasta'.";
        return;
      }

      btnPdf.disabled = true;
      btnPdf.textContent = "Generando...";

      try {
        const url = `/api/generate-pdf?desde=${pdfDesde.value}&hasta=${pdfHasta.value}`;
        const res = await fetch(url);
        if (!res.ok) {
          const texto = await res.text();
          throw new Error(texto || "No se pudo generar el PDF");
        }
        const blob = await res.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `comidas_${pdfDesde.value}_a_${pdfHasta.value}.pdf`;
        document.body.appendChild(link);
        link.click();
        link.remove();
      } catch (err) {
        pdfMsg.textContent = err.message;
      } finally {
        btnPdf.disabled = false;
        btnPdf.textContent = "Generar PDF";
      }
    });

    renderFechaLabel();
    buildCards();
  </script>
</body>
</html>
